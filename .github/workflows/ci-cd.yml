name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'DEPLOYMENT.md'
      - 'REGISTRATION_SETUP.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'ASSETS.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - 'LICENSE'
      - 'code.gs'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    uses: LABEIM/Shared-CICD/.github/workflows/deploy-app.yml@v1
    with:
      # Runtime & Build
      node_version: '22'
      package_manager: 'auto'
      check_command: 'pnpm exec astro check'
      build_command: 'pnpm run build'
      dist_dir: 'dist'

      # Platforms
      enable_cloudflare: true
      cloudflare_project_name: 'lab-eim'
      production_branch: 'main'

      # Vercel backup is enabled automatically once both IDs exist as
      # repository variables (Settings > Secrets and variables > Actions >
      # Variables). They cannot be secrets: reusable-workflow `with:` inputs
      # cannot read the `secrets` context.
      enable_vercel: ${{ vars.VERCEL_PROJECT_ID != '' && vars.VERCEL_ORG_ID != '' }}
      vercel_project_id: ${{ vars.VERCEL_PROJECT_ID }}
      vercel_org_id: ${{ vars.VERCEL_ORG_ID }}

      # Feedback & Audits
      enable_pr_comment: true
      enable_lighthouse: true
      lighthouse_routes: |
        /
        /about/
        /contact/
        /structure/
        /registration/
        /event/
        /news/
        /event/audit-benchmark-event/
        /news/audit-benchmark-news/
      lighthouse_config_path: ${{ github.event_name == 'pull_request' && './.lighthouserc.json' || './.lighthouserc.prod.json' }}

    # Build-time PUBLIC_* secrets (PUBLIC_GOOGLE_SHEET_SCRIPT_URL,
    # PUBLIC_RECRUITMENT_SECRET, ...) are exported by the shared workflow.
    secrets: inherit
