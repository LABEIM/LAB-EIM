name: Unified CI/CD Pipeline (Cloudflare Primary + Vercel Backup)

on:
  push:
    branches: [ "main", "master", "astro-version" ]
  pull_request:
    branches: [ "main", "master", "astro-version" ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target platform for deployment'
        required: true
        default: 'primary'
        type: choice
        options:
          - primary
          - backup
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: CI Validation & Static Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Astro diagnostics
        run: npx astro check

      - name: Build static site export
        run: npm run build
        env:
          PUBLIC_GOOGLE_SHEET_SCRIPT_URL: ${{ secrets.PUBLIC_GOOGLE_SHEET_SCRIPT_URL }}

      - name: Upload dist build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-static-build
          path: dist/
          retention-days: 1

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages (Primary)
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'primary' || inputs.deploy_target == 'both'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: ${{ steps.deploy_cloudflare.outputs.url }}
    outputs:
      deploy_url: ${{ steps.deploy_cloudflare.outputs.url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download dist build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-static-build
          path: dist/

      - name: Deploy to Cloudflare Pages
        id: deploy_cloudflare
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME || 'lab-eim' }}
          directory: dist
          branch: ${{ github.ref_name }}

  deploy-vercel-backup:
    name: Deploy to Vercel (Failover Backup)
    needs: [validate, deploy-cloudflare]
    if: |
      always() &&
      needs.validate.result == 'success' && (
        needs.deploy-cloudflare.result == 'failure' ||
        (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'backup' || inputs.deploy_target == 'both'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: backup-production
      url: ${{ steps.deploy_production.outputs.deploy_url }}
    outputs:
      deploy_url: ${{ steps.deploy_production.outputs.deploy_url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download dist build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-static-build
          path: dist/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy static output to Vercel
        id: deploy_production
        run: |
          DEPLOY_URL=$(vercel deploy dist --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

  lighthouse:
    name: Lighthouse Audit
    needs: deploy-cloudflare
    if: always() && needs.deploy-cloudflare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Lighthouse audit (Live Cloudflare URL)
        if: ${{ needs.deploy-cloudflare.outputs.deploy_url }}
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './.lighthouserc.json'
          urls: |
            ${{ needs.deploy-cloudflare.outputs.deploy_url }}

      - name: Run Lighthouse audit (Static Fallback)
        if: ${{ !needs.deploy-cloudflare.outputs.deploy_url }}
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './.lighthouserc.json'

