name: Unified CI/CD Pipeline (Cloudflare Primary + Vercel Backup)

on:
  push:
    branches: [ "main", "master", "astro-version" ]
  pull_request:
    branches: [ "main", "master", "astro-version" ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target platform for deployment'
        required: true
        default: 'primary'
        type: choice
        options:
          - primary
          - backup
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: CI Validation & Static Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Astro diagnostics
        run: npx astro check

      - name: Build static site export
        run: |
          rm -rf .astro dist
          npm run build
        env:
          PUBLIC_GOOGLE_SHEET_SCRIPT_URL: ${{ secrets.PUBLIC_GOOGLE_SHEET_SCRIPT_URL }}
          PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: ${{ secrets.PUBLIC_KEYSTATIC_GITHUB_APP_SLUG }}
          PUBLIC_RECRUITMENT_SECRET: ${{ secrets.PUBLIC_RECRUITMENT_SECRET }}

      - name: Upload dist build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-static-build
          path: dist/
          retention-days: 1

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages (Primary)
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'primary' || inputs.deploy_target == 'both'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'cloudflare-preview' || 'production' }}
      url: ${{ steps.deploy_cloudflare.outputs.deploy_url }}
    outputs:
      deploy_url: ${{ steps.deploy_cloudflare.outputs.deploy_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download dist build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-static-build
          path: dist/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Cloudflare Pages via Wrangler
        id: deploy_cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          RAW_PROJECT_NAME="${{ secrets.CLOUDFLARE_PROJECT_NAME }}"
          PROJECT_NAME="${RAW_PROJECT_NAME:-lab-eim}"
          
          RAW_HEAD_REF="${{ github.head_ref }}"
          RAW_REF_NAME="${{ github.ref_name }}"
          BRANCH_NAME="${RAW_HEAD_REF:-$RAW_REF_NAME}"
          
          # Auto-create Pages project shell if it does not exist yet
          npx wrangler pages project create "$PROJECT_NAME" --production-branch="main" > /dev/null 2>&1 || true

          # Deploy prebuilt static assets to Cloudflare Pages / Workers
          npx wrangler pages deploy dist --project-name="$PROJECT_NAME" --branch="$BRANCH_NAME" --commit-dirty=true 2>&1 | tee deploy.log

          # Extract live deployment URL (.pages.dev or .workers.dev) safely using Node.js
          DEPLOY_URL=$(NODE_OPTIONS="--no-warnings" node -e '
            const fs = require("fs");
            if (!fs.existsSync("deploy.log")) process.exit(0);
            const log = fs.readFileSync("deploy.log", "utf8");
            const cleanLog = log.replace(/\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])/g, "");
            const matches = cleanLog.match(/https:\/\/[a-zA-Z0-9.-]+\.(pages\.dev|workers\.dev)/gi) || [];
            const valid = matches.find(u => {
              const lower = u.toLowerCase();
              return !lower.includes("dash.cloudflare.com") && !lower.includes("api.cloudflare.com");
            });
            if (valid) {
              const cleanUrl = valid.replace(/[^a-zA-Z0-9.:/_-]/g, "").trim();
              process.stdout.write(cleanUrl);
            }
          ')

          # Sanitize extracted URL
          DEPLOY_URL=$(echo "$DEPLOY_URL" | tr -d '\r\n\t ' | sed 's/[^a-zA-Z0-9.:/_-]//g')

          # Fallback to standard Cloudflare Pages branch preview URL pattern if extraction was empty
          if [ -z "$DEPLOY_URL" ] || ! echo "$DEPLOY_URL" | grep -q '^https://'; then
            CLEAN_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/^-//;s/-$//')
            if [ "$CLEAN_BRANCH" = "main" ] || [ "$CLEAN_BRANCH" = "master" ]; then
              DEPLOY_URL="https://${PROJECT_NAME}.pages.dev"
            else
              DEPLOY_URL="https://${CLEAN_BRANCH}.${PROJECT_NAME}.pages.dev"
            fi
          fi

          DEPLOY_URL=$(echo "$DEPLOY_URL" | tr -d '\r\n\t ' | sed 's/[^a-zA-Z0-9.:/_-]//g')

          echo "Captured live deployment URL: $DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

  deploy-vercel:
    name: Deploy to Vercel (Parallel Target)
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'backup' || inputs.deploy_target == 'both'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'vercel-preview' || 'backup-production' }}
      url: ${{ steps.deploy_preview.outputs.deploy_url || steps.deploy_production.outputs.deploy_url }}
    outputs:
      deploy_url: ${{ steps.deploy_preview.outputs.deploy_url || steps.deploy_production.outputs.deploy_url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download dist build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-static-build
          path: dist/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy static output to Vercel (Preview)
        if: github.event_name == 'pull_request'
        id: deploy_preview
        run: |
          DEPLOY_URL=$(vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Deploy static output to Vercel (Production)
        if: github.event_name != 'pull_request'
        id: deploy_production
        run: |
          DEPLOY_URL=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

  comment-pr:
    name: Post PR Preview Comment
    needs: [deploy-cloudflare, deploy-vercel]
    if: github.event_name == 'pull_request' && (needs.deploy-cloudflare.result == 'success' || needs.deploy-vercel.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Comment PR Preview URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CF_URL: ${{ needs.deploy-cloudflare.outputs.deploy_url }}
          VERCEL_URL: ${{ needs.deploy-vercel.outputs.deploy_url }}
        run: |
          CF_CLEAN=$(echo "$CF_URL" | tr -d '\r\n\t ' | sed 's/[^a-zA-Z0-9.:/_-]//g')
          VERCEL_CLEAN=$(echo "$VERCEL_URL" | tr -d '\r\n\t ' | sed 's/[^a-zA-Z0-9.:/_-]//g')

          echo "Captured CF_URL: '$CF_CLEAN'"
          echo "Captured VERCEL_URL: '$VERCEL_CLEAN'"

          COMMENT_BODY="🚀 **Preview Deployments Ready!**"
          if [ -n "$CF_CLEAN" ]; then
            COMMENT_BODY="$COMMENT_BODY

          - ☁️ **Cloudflare Pages Preview**: $CF_CLEAN"
          fi
          if [ -n "$VERCEL_CLEAN" ]; then
            COMMENT_BODY="$COMMENT_BODY

          - ▲ **Vercel Preview**: $VERCEL_CLEAN"
          fi

          EXISTING_COMMENT=$(gh api "repos/${GH_REPO}/issues/${{ github.event.pull_request.number }}/comments" --jq '.[] | select(.user.login=="github-actions[bot]" and (.body | contains("Preview Deployments Ready"))) | .id' | tail -n 1)

          if [ -n "$EXISTING_COMMENT" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${EXISTING_COMMENT}" -f body="$COMMENT_BODY"
          else
            gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT_BODY"
          fi

  lighthouse:
    name: Lighthouse Audit
    needs: deploy-cloudflare
    if: always() && needs.deploy-cloudflare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download dist build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-static-build
          path: dist/

      - name: Run Lighthouse audit (Live Cloudflare URL)
        if: ${{ needs.deploy-cloudflare.outputs.deploy_url }}
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './.lighthouserc.json'
          urls: |
            ${{ needs.deploy-cloudflare.outputs.deploy_url }}

      - name: Run Lighthouse audit (Static Fallback)
        if: ${{ !needs.deploy-cloudflare.outputs.deploy_url }}
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './.lighthouserc.json'
