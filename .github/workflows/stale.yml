name: Stale Issues & PRs Cleanup

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark & Close Stale Items
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process stale issues and PRs
        uses: actions/stale@v11
        with:
          # Issues
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 7 days if no further activity occurs.
          close-issue-message: >
            This issue has been automatically closed due to inactivity. Feel free to
            reopen it if the issue is still relevant.
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,bug'

          # Pull Requests
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity. Feel free to
            reopen it if it is still relevant.
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,security,work-in-progress'

          # General
          operations-per-run: 30
