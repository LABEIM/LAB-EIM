name: Unified CI/CD Pipeline (Cloudflare Primary + Vercel Backup)

on:
  push:
    branches: [ "main", "master", "astro-version" ]
  pull_request:
    branches: [ "main", "master", "astro-version" ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target platform for deployment'
        required: true
        default: 'primary'
        type: choice
        options:
          - primary
          - backup
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: CI Validation & Static Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Astro diagnostics
        run: npx astro check

      - name: Build static site export
        run: |
          rm -rf .astro dist
          npm run build
        env:
          PUBLIC_GOOGLE_SHEET_SCRIPT_URL: ${{ secrets.PUBLIC_GOOGLE_SHEET_SCRIPT_URL }}
          PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: ${{ secrets.PUBLIC_KEYSTATIC_GITHUB_APP_SLUG }}

      - name: Upload dist build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-static-build
          path: dist/
          retention-days: 1

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages (Primary)
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'primary' || inputs.deploy_target == 'both'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy_cloudflare.outputs.url }}
    outputs:
      deploy_url: ${{ steps.deploy_cloudflare.outputs.url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download dist build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-static-build
          path: dist/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Cloudflare Pages via Wrangler
        id: deploy_cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT_NAME="${{ secrets.CLOUDFLARE_PROJECT_NAME || 'lab-eim' }}"
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          
          # Auto-create Pages project shell if it does not exist yet
          npx wrangler pages project create "$PROJECT_NAME" --production-branch="main" > /dev/null 2>&1 || true

          # Deploy prebuilt static assets to Cloudflare Pages / Workers
          npx wrangler pages deploy dist --project-name="$PROJECT_NAME" --branch="$BRANCH_NAME" --commit-dirty=true | tee deploy.log

          # Extract live deployment URL (.workers.dev or .pages.dev)
          DEPLOY_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.(workers\.dev|pages\.dev)' deploy.log | head -n 1)
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://${PROJECT_NAME}.laboratoriumeim.workers.dev"
          fi
          echo "Captured live deployment URL: $DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

  deploy-vercel:
    name: Deploy to Vercel (Parallel Target)
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'backup' || inputs.deploy_target == 'both'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'backup-production' }}
      url: ${{ steps.deploy_preview.outputs.deploy_url || steps.deploy_production.outputs.deploy_url }}
    outputs:
      deploy_url: ${{ steps.deploy_preview.outputs.deploy_url || steps.deploy_production.outputs.deploy_url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download dist build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-static-build
          path: dist/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy static output to Vercel (Preview)
        if: github.event_name == 'pull_request'
        id: deploy_preview
        run: |
          DEPLOY_URL=$(vercel deploy dist --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Deploy static output to Vercel (Production)
        if: github.event_name != 'pull_request'
        id: deploy_production
        run: |
          DEPLOY_URL=$(vercel deploy dist --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

  comment-pr:
    name: Post PR Preview Comment
    needs: [deploy-cloudflare, deploy-vercel]
    if: github.event_name == 'pull_request' && success()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR Preview URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_URL: ${{ needs.deploy-cloudflare.outputs.deploy_url }}
          VERCEL_URL: ${{ needs.deploy-vercel.outputs.deploy_url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "🚀 **Preview Deployments Ready!**

          - ☁️ **Cloudflare Pages Preview**: $CF_URL
          - ▲ **Vercel Preview**: $VERCEL_URL"

  lighthouse:
    name: Lighthouse Audit
    needs: deploy-cloudflare
    if: always() && needs.deploy-cloudflare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download dist build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-static-build
          path: dist/

      - name: Run Lighthouse audit (Live Cloudflare URL)
        if: ${{ needs.deploy-cloudflare.outputs.deploy_url }}
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './.lighthouserc.json'
          urls: |
            ${{ needs.deploy-cloudflare.outputs.deploy_url }}

      - name: Run Lighthouse audit (Static Fallback)
        if: ${{ !needs.deploy-cloudflare.outputs.deploy_url }}
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './.lighthouserc.json'
