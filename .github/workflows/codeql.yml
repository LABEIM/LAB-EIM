name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly on Monday at 04:30 UTC
    - cron: '30 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    uses: LABEIM/Shared-CICD/.github/workflows/codeql-scan.yml@v2
    with:
      language: 'javascript-typescript'
